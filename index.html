<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroDeVacunacion</title>
    <meta name="view-transition" content="same-origin">
    <style>
        /* el * es para que afecte a la mayoria de etiquetas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /*ps aqui es la fuente y los margenes para que cuadre con diseño de los navegadores web*/
        }

        body {
            background-image: url('fondo.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            overflow-y:auto;
            /*el gif de fondo que coloque*/
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 25, 47, 0.65);
            z-index: 1;
            /*esto es para que se vea mas oscurito, y todo, practicamente donde lo edito dentro de la pagina xd*/
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            /*es lo que contiene toda la pagina web, digamos que es muy amiga de los margenes de arriba*/
        }

        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 25px 40px;
            /*esto es para las trees barritas que le colocamos en la esquina*/
        }

        .profile-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-grow: 1;
            /*para los botones del perfil*/
        }

        .profile-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
            /*mi parte fav, pero mas dificil de hacer, los botones de arriba*/
        }

        .profile-btn.active, .profile-btn:hover {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            border-bottom: 3px solid #0d6efd;
            /*esto tambien va con lo de profile-btn, pero es que esto me frego la vida ps*/
        }

        .settings-icon {
            color: #ffffff;
            font-size: 2rem;
            cursor: pointer;
            background: transparent;
            border: none;
            /*esto es para el icono de configuración de los trees barritas*/
        }

        .center-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding:10px 20px 30px 20px;
            min-height: 0;
            /*esto es lo que centra el login*/
        }

        .custom-card {
            background-color: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 25px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            /*esto es lit el diseño del login para que se vea asi difuminadito y esp*/
        }

        .d-none {
            display: none !important;
            /*para ocultar y mostrar las tarjetas de forma limpia*/
        }

        /* Estilos de la lista de estados */
        .stats-list {
            list-style: none;
            color: white;
            text-align: left;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
        }

        .text-card-white {
            color: #ffffff !important;
            text-align: center;
            /*afecta los textos dentro de la tarjeta y lee obliga a que ignore otra regla quee no sea esta*/
        }


        /*estos dos separaciones para que no se vea amontonado todo, tomar en cuwenta que esto es del framework*/
        .mb-4 {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            /*son las etiquetas de los campos de formulario para poder decir correo o nombre etc etfc*/
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            /*esto no se muy bien explicarlo, pero es dentro del globo blanco para que las personas al ingresar y eso tengan un tamaño estandar y todo*/
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #0d6efd;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
            /*es resaltar la caja con un borde azul brillante cuando el usuario hace clic adentro para empezar a escribir*/
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
            /*las letras que si el ingrese su contraseña, la que se borra al escribirla*/
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
            margin-bottom: 20px;
            /*como dice el nombre es para ingresar al sistema es el que afecta el boton de iniciar sesion y todo lo que tenga que ver con eso*/
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            /*es para que sea vea bien al tocar el boton azul de ingresar*/
        }

        .register-redirect {
            text-align: center;
            color: #ffffff;
            font-size: 0.9rem;
            /*es para poner en curisiva lo de registrate uwu*/
        }

        .register-redirect a {
            color: #6ea8fe;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
            /*es el enlace para llevarlo al otro lugar a que se registre*/
        }

        .register-redirect a:hover {
            color: #0d6efd;
            text-decoration: underline;
            /*es para que el enlace de registro se vea diferente al pasar el mouse por encima*/
        }

        @media (max-width: 600px) {
            /*esto es para que se adaprte a cualquier pantalla*/
            .top-navbar {
            flex-direction: column; 
            gap: 15px;
            padding: 15px 20px;
            }

            .settings-icon {
                align-self: flex-start;
            }

            /* se deben reacomodar las listas y el login que teniamos anteass*/
            .profile-container {
                flex-direction: column; /* cambia a lista vertical para que no se amontone de lado */
                gap: 10px; 
                width: 100%;
                text-align: center;
            }

            .content-wrapper {
                height: auto; /* permite que el contenido se ajuste al tamaño de la pantalla */
                padding-bottom: 100px; /* agrega un poco de espacio inferior */
            }

            /* ajustamos el tamaño de las letras de los perfiles para celular, aqui le metemos a todo*/
            .profile-btn {
                font-size: 1.1rem;
                padding: 5px 0;
            }

            /* esto es para que no se vea un desastre al ajustars*/
            .top-navbar div[style*="width"] {
                display: none !important;
            }

            /*y aqui afinamos detalles */
            .custom-card {
                padding: 25px 20px;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="video-overlay"></div>
    
    <div class="content-wrapper">
        <div class="top-navbar">
            <button class="settings-icon" title="Ajustes">☰</button>
            <div class="profile-container">
                <button class="profile-btn active" id="btn-Master">Master</button>
                <button class="profile-btn" id="btn-SubRegion">Sub-Region</button>
                <button class="profile-btn" id="btn-CentroDeVacunacion">Centro de Vacunación</button>
            </div>
            <div style="width: 45px;"></div>
        </div>

        <div class="center-container">
            <div class="custom-card">
                <div class="text-card-white mb-4">
                    <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;">Registro de Vacunación Nacional</h2>
                </div>

                <form id="login">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario o Correo Electrónico</label>
                        <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario o correo electrónico" required>
                    </div>

                    <div class="mb-3">
                        <label for="cedula" class="form-label">Cédula de Identidad</label>
                        <input type="text" id="cedula" class="form-control" placeholder="Ej: V-12345678" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" id="contraseña" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>

                    <button type="submit" class="btn-submit">Iniciar Sesión</button>

                    <div class="register-redirect mb-3">
                        ¿No tienes una cuenta? <a href="registro.html" id="link-registro">Regístrate aquí</a>
                    </div>

                    <div class="register-redirect">
                        <!-- El enlace redirige a la otra página creada dxe los usuarios -->
                        <a href="consulta.html" id="link-ver-estados" style="color: #a6c8ff;">Ver Estados de Vacunación</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script>
    const profileButtons = document.querySelectorAll('.profile-btn');
    profileButtons.forEach(button => {
        button.addEventListener('click', () => {
                profileButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
        });
    });

    const settingsBtn = document.querySelector('.settings-icon');
    settingsBtn.addEventListener('click', () => {
        alert("boton de ajustes,  que me falta hacer xd");
    });
</script>
</body>
</html>
