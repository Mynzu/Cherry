<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistroDeVacunacion</title>
    <meta name="view-transition" content="same-origin"> 
 
    <style>
    /* el * es para que afecte a la mayoria de etiquetas */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        /* ps aqui es la fuente y los margenes para que cuadre con diseño de los navegadores web */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    body {
        /* el gif de fondo que coloque */
        background-image: url('fondo.gif');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        overflow-y: auto;
    }

    .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /* esto es para que se vea mas oscurito, y todo, practicamente donde lo edito dentro de la pagina xd */
        background-color: rgba(10, 25, 47, 0.65);
        z-index: 1;
    }

    .content-wrapper {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        flex-direction: column;
        /* es lo que contiene toda la pagina web, digamos que es muy amiga de los margenes de arriba */
    }


    .top-navbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 30px;
        width: 100%;
        padding: 25px 40px;
        /* esto es para las trees barritas que le colocamos en la esquina */
    }

    .settings-icon {
        color: #ffffff;
        font-size: 2rem;
        cursor: pointer;
        background: transparent;
        border: none;
    }

    .circle-container {
        display: flex;
        gap: 25px;
        align-items: center;
        /* mi parte fav, pero mas dificil de hacer, los botones de arriba */
    }

    .profile-circle {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: pointer;
        padding: 5px 2px;
        transition: all 0.3s ease;
        display: inline-block;
        /* esto tambien va con lo de profile-btn, pero es que esto me frego la vida ps */
    }

    .profile-circle.active, .profile-circle:hover {
        color: #ffffff !important;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        border-bottom: 3px solid #0d6efd;
        /* esto es para cuando pasas el mouse o dejas activo el boton, que brille y se ponga la rayita azul abajo */
    }

    .profile-circle:not(:last-child)::after {
        content: "|";
        color: rgba(255, 255, 255, 0.3);
        margin-left: 25px;
        display: inline-block;
        pointer-events: none;
        text-shadow: none;
        /* el separador de palito "|" entre cada boton, para que no se peguen */
    }

    .center-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-grow: 1;
        padding: 20px 40px 40px 40px;
        /* esta caja es para centrar todo lo que va en el medio de la pantalla */
    }

    .main-dashboard {
        display: flex;
        flex-wrap: wrap;
        gap: 50px;
        width: 100%;
        max-width: 1050px;
        align-items: center;
         /* el panel principal donde se acomodan los cuadros de la pagina */ 
    }

    .dashboard-left {
        flex: 1;
        min-width: 320px;
        display: flex;
        justify-content: center;
        align-items: flex-start;  
        margin-top: -60px; 
        /* el lado izquierdo, le puse el margen negativo para subirlo un poco y cuadre con el login */
    }

    .interactive-drawing-card {
        background-color: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        padding: 20px;            
        width: 100%;
        max-width: 360px;         
        text-align: center;
        color: white;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: center;
        /* la tarjeta del certificado compacta para que no ocupe tanto espacio */
    }

    .dashboard-right {
        flex: 1;
        min-width: 380px;         
        display: flex;
        justify-content: center;
        align-items: flex-start;  
        margin-top: -110px;       
        /* subimos el login bastante para pegarlo mas a la barra de arriba */
    }
    .custom-card {
        background-color: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 380px;
        min-height: 440px;        
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        justify-content: space-between; 
        /* tamaño fijo para que la tarjeta del login no se mueva feo al cambiar de perfil */
    }

    .dashboard-left {
        flex: 1;
        min-width: 320px;
        display: flex;
        justify-content: center;
        align-items: flex-start;  
        margin-top: -40px;        
        /* subimos un poquito el certificado para que quede alineado con lo demas */
    }

    .custom-card {
        background-color: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        
        min-height: 380px; 
        transition: min-height 0.3s ease-in-out; 
        
        display: flex;
        flex-direction: column;
        /* animacion fluida para cuando cambie de tamaño segun los datos */
    }

    #login {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        justify-content: space-between; 
        /* acomoda los inputs y botones limpios y bien distribuidos */
    }


    .text-card-white {
        color: #ffffff !important;
        text-align: center;
        /* centramos el texto blanco de las tarjetas */
    }

    
    .mb-3 { 
        margin-bottom: 12px; 
    } 
    /*esto crea espacios de interliniado por asi decirlo*/
    .mb-4 { 
        margin-bottom: 16px; 
    } 

    .form-label {
        display: block;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.9rem;
        /* los textos de los titulos de cada input */
    }
    
    .form-control {
        width: 100%;
        padding: 10px 12px; 
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.5); 
        background: rgba(0, 0, 0, 0.3);             
        color: white;
        font-size: 0.95rem;
        outline: none;
        /* estilo para las cajitas de texto donde el usuario escribe */
    }   

    /* Esto hace que el texto de ejemplo dentro de los inputs sea más blanco */
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.65) !important;
    }

    .btn-submit {
        width: 100%;
        padding: 11px; 
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        margin-bottom: 12px;
        transition: all 0.3s ease;
        /* el boton azul de enviar con su sombrita */
    }
    .btn-submit:hover {
        background-color: #0b5ed7;
        transform: translateY(-2px);
        /* efecto para que el boton suba un poquito cuando le pasas el mouse */
    }
    .register-redirect {
        text-align: center;
        color: #ffffff;
        font-size: 0.9rem;
        /* el texto de abajo, la contraseña y eso*/
    }

    .register-redirect a:hover {
        color: #0d6efd;
        text-decoration: underline;
        /* rayita abajo cuando pasas el mouse por el link */
    }

    .mb-3, .mb-4 {
        margin-bottom: 15px;
        transition: all 0.3s ease;
        /* los margenes con animacion para que no se mueva tosco */
    }
    .d-none {
        display: none !important;
        /* truco para ocultar cosas de la pantalla por completo */
    }

    @media (max-width: 768px) {
        .top-navbar { 
            flex-direction: column; 
            align-items: flex-start;
            gap: 15px; 
            padding: 15px 20px; 
        }

        .circle-container { 
            flex-wrap: wrap; 
        }

        .center-container { 
            padding: 10px 20px 40px 20px; 
            margin-top: 0; 
        }

        .main-dashboard { 
            flex-direction: column; 
            gap: 35px; 
        }

        .custom-card { 
            max-width: 100%; 
        }
        /* aca acomodamos todo para que en telefonos se vea en vertical y no se rompa el diseño */
    }
    </style>
</head>

</head>
<body>
    <div class="video-overlay"></div>
    <!--la capa oscura para que el fondo gif no canse la vista-->
    
    <div class="content-wrapper">
        <div class="top-navbar">
            <button class="settings-icon" title="Ajustes">☰</button>

            <div class="circle-container">
                <button type="button" class="profile-circle active" data-profile="master">Master</button>
                <button type="button" class="profile-circle" data-profile="subregion">Sub-Region</button>
                <button type="button" class="profile-circle" data-profile="centro">Centro Vacunación</button>
            </div>
            <!--las tres barritas de la esquina y los botones de los perfiles juntos en la misma linea-->
        </div>

        <div class="center-container">
            <div class="main-dashboard">
                        
                <div class="dashboard-left">
                    <div class="interactive-drawing-card">
                        <h4 style="margin-bottom: 6px; font-size: 1.1rem; font-weight: 700;">¿Buscas tu Certificado?</h4>
                        <p style="font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 15px;">¡¡Accede como ciudadano y descarga tu registro de Vacunacion!!</p>
                        <a href="consulta.html" class="btn-submit" style="display: inline-block; text-decoration: none; width: auto; padding: 8px 20px; font-size: 0.95rem; margin-bottom: 0;">Accede a tu Registro</a>
                    </div>
                    <!--el cuadro del certificado para que la gente descargue su registro rapido -->
                </div>

                <div class="dashboard-right">
                    <div class="custom-card">
                        <div class="text-card-white mb-4">
                            <h2 id="login-title" style="font-size: 1.6rem; font-weight: 700;">Master</h2>
                        </div>

                        <form id="login" novalidate> <!--meti validaciones-->
                            <div class="mb-3" id="group-usuario">
                                <label for="usuario" class="form-label" id="label-usuario">Usuario Administrador</label>
                                <input type="text" id="usuario" class="form-control" placeholder="Ingrese código Master" required>
                                <span class="error-msg" id="error-usuario" style="color: #ff6b6b; font-size: 0.8rem; display: none; margin-top: 4px;"></span>
                            </div>

                            <div class="mb-3 d-none" id="group-region">
                                <label for="region" class="form-label">Código Regional</label>
                                <!-- Esto es para que quede tojo junto al metetr el codigo -->
                                <input type="text" id="region" class="form-control" placeholder="Ej: REG-ARAGUA" pattern="^REG-[A-Za-z0-9]+$">
                                <span class="error-msg" id="error-region" style="color: #ff6b6b; font-size: 0.8rem; display: none; margin-top: 4px;"></span>
                            </div>

                            <div class="mb-3 d-none" id="group-centro">
                                <label for="centro" class="form-label">ID del Centro Médico</label>
                                <!--Lo mismo que el de arriba -->
                                <input type="text" id="centro" class="form-control" placeholder="Ej: HOSP-021" pattern="^HOSP-[0-9]+$">
                                <span class="error-msg" id="error-centro" style="color: #ff6b6b; font-size: 0.8rem; display: none; margin-top: 4px;"></span>
                            </div>

                            <div class="mb-4">
                                <label for="contraseña" class="form-label">Contraseña</label>
                                <input type="password" id="contraseña" class="form-control" placeholder="Ingrese su contraseña" minlength="6" required>
                                <span class="error-msg" id="error-contraseña" style="color: #ff6b6b; font-size: 0.8rem; display: none; margin-top: 4px;"></span>
                            </div>

                            <button type="submit" class="btn-submit">Iniciar Sesión</button>

                            <div class="register-redirect">
                                <a href="recuperar.html" style="color: #ff6b6b; font-weight: 600;">¿Olvidaste tu contraseña?</a>
                            </div>
                        </form>
                    </div>
                    <!--la tarjeta del login bien acomodada a la derecha-->
                </div>

            </div> <!-- Cierre de main-dashboard -->
        </div> <!-- Cierre de center-container -->
    </div> <!-- Cierre de content-wrapper -->

<script>
    const circles = document.querySelectorAll('.profile-circle');
    const loginTitle = document.getElementById('login-title');
    const labelUsuario = document.getElementById('label-usuario');
    const inputUsuario = document.getElementById('usuario');

    const groupRegion = document.getElementById('group-region');    
    const groupCentro = document.getElementById('group-centro');
    const inputRegion = document.getElementById('region');
    const inputCentro = document.getElementById('centro');
    const inputPassword = document.getElementById('contraseña');

    // Cambios de perfil
    circles.forEach(circle => {
        circle.addEventListener('click', () => {
            circles.forEach(c => c.classList.remove('active'));
            circle.classList.add('active');

            const profile = circle.getAttribute('data-profile');
            const card = document.querySelector('.custom-card'); 
            
            // Limpiar errores previos al cambiar de pestaña
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            if (profile === 'master') {
                loginTitle.innerText = "Iniciar Sesión: Master";
                labelUsuario.innerText = "Usuario Administrador";
                inputUsuario.placeholder = "Ingrese código Master";
                
                groupRegion.classList.add('d-none');
                groupCentro.classList.add('d-none');
                inputRegion.removeAttribute('required');
                inputCentro.removeAttribute('required');
                
                card.style.minHeight = "380px"; 
            } 
            else if (profile === 'subregion') {
                loginTitle.innerText = "Acceso: Sub-Region";
                labelUsuario.innerText = "Usuario Regional";
                inputUsuario.placeholder = "Ingrese usuario de sub-región";
                
                groupRegion.classList.remove('d-none');
                groupCentro.classList.add('d-none');
                inputRegion.setAttribute('required', 'true');
                inputCentro.removeAttribute('required');
                
                card.style.minHeight = "460px"; 
            } 
            else if (profile === 'centro') {
                loginTitle.innerText = "Acceso: Centro Médico";
                labelUsuario.innerText = "Usuario del Centro";
                inputUsuario.placeholder = "Ingrese usuario de enfermería";
                
                groupRegion.classList.add('d-none');
                groupCentro.classList.remove('d-none');
                inputRegion.removeAttribute('required');
                inputCentro.setAttribute('required', 'true');
                
                card.style.minHeight = "460px"; 
            }
        });
    });

    // Función auxiliar para mostrar/ocultar mensajes de error estéticos
    function validarCampo(input, elementoError, mensajePersonalizado = "") {
        if (!input.hasAttribute('required') && input.closest('.d-none')) {
            elementoError.style.display = 'none';
            return true; // Si el campo está oculto y no es requerido, es válido
        }

        // Validación de vacío
        if (input.hasAttribute('required') && input.value.trim() === "") {
            elementoError.innerText = "Este campo es obligatorio.";
            elementoError.style.display = 'block';
            return false;
        }

        // Validación de expresiones regulares (pattern) o longitud mínima
        if (!input.checkValidity()) {
            elementoError.innerText = mensajePersonalizado || input.validationMessage;
            elementoError.style.display = 'block';
            return false;
        }

        elementoError.style.display = 'none';
        return true;
    }

    // Manejo del formulario
    const loginForm = document.getElementById('login');

    loginForm.addEventListener('submit', (event) => {
        event.preventDefault(); 

        // Ejecutar las validaciones
        const esUsuarioValido = validarCampo(inputUsuario, document.getElementById('error-usuario'));
        const esPasswordValido = validarCampo(inputPassword, document.getElementById('error-contraseña'), "La contraseña debe tener al menos 6 caracteres.");
        const esRegionValida = validarCampo(inputRegion, document.getElementById('error-region'), "El código debe empezar con 'REG-' seguido de letras o números.");
        const esCentroValido = validarCampo(inputCentro, document.getElementById('error-centro'), "El ID debe empezar con 'HOSP-' seguido únicamente de números.");

        // Si alguna validación falla, detenemos el envío
        if (!esUsuarioValido || !esPasswordValido || !esRegionValida || !esCentroValido) {
            return;
        }

        // Si todo está correcto, proceder al redireccionamiento
        const activeCircle = document.querySelector('.profile-circle.active');
        const activeProfile = activeCircle.getAttribute('data-profile');

        if (activeProfile === 'master') {
            window.location.href = "Master.html";
        } 
        else if (activeProfile === 'subregion') {
            window.location.href = "subregion_dashboard.html";
        } 
        else if (activeProfile === 'centro') {
            window.location.href = "vacuna.html";
        }
    });

    // El botón de ajustes gracioso xdd
    const settingsBtn = document.querySelector('.settings-icon');
    settingsBtn.addEventListener('click', () => {
        alert("El botón de Ajustes, que aun no hago xdd");
    });
</script>
</body>
</html>
