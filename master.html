<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master</title>
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif, system-ui;
            /*lo mismo de siempre, para que se mantenga*/
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0a1426;
        }

        /* la capa del fondo, donde va el gif */
        .bg-gif-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        .bg-gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* editamos el giif */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 20, 38, 0.75);
            z-index: -1;
        }

        .main-wrapper {
            position: relative;
            width: 980px;
            height: 580px;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        /* la tarjeta izquierda el menú */
        .left-menu-card {
            position: absolute;
            left: 0;
            width: 450px;
            height: 520px;
            background: rgba(15, 32, 67, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            z-index: 1;
        }

        .menu-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Botones del menú */
        .menu-btn {
            width: 100%;
            padding: 13px 22px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            color: #d1e5f7;
            font-size: 0.98rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .menu-btn:hover {
            background: rgba(0, 180, 216, 0.25);
            color: #ffffff;
            border-color: rgba(0, 180, 216, 0.5);
            transform: translateX(5px);
        }

        .menu-btn.active {
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            box-shadow: 0 5px 18px rgba(0, 180, 216, 0.45);
            border-color: transparent;
            color: #ffffff;
            font-weight: 600;
            transform: translateX(5px);
        }

        /* tarjeta derecha */
        .right-data-card {
            position: absolute;
            right: 0;
            width: 540px;
            height: 560px;
            background: rgba(10, 22, 42, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(0, 180, 216, 0.22);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ffffff;
            z-index: 2;
            overflow-y: auto;
        }

        .right-data-card h2 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffffff, #90e0ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /*Campos de entrada*/
        .input-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #90e0ef;
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 9px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-bottom: 2px solid rgba(144, 224, 239, 0.35);
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            border-radius: 8px 8px 0 0;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-bottom-color: #00b4d8;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-group input::placeholder {
            color: rgba(200, 225, 245, 0.35);
        }

        /* Botón de envío*/
        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.5);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            margin-top: 5px;
        }

        .register-redirect {
            text-align: center;
            margin-top: 10px;
        }

        .register-redirect a {
            color: #ff6b6b;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div id="app">
        <!--el gif-->
        <div class="bg-gif-container">
            <img src="fondo.gif" alt="Fondo interactivo">
        </div>

        <!-- para que sea oscurityo-->
        <div class="bg-overlay"></div>

        <!--para mantenerse -->
        <div class="main-wrapper">
            
            <!--la tarjeta izquierda -->
            <div class="left-menu-card">
                <h2 class="menu-title">Menú Principal</h2>
                <a href="#" class="menu-btn" :class="{ active: seccionActual === 'ingresar' }" @click.prevent="seccionActual = 'ingresar'">Ingresar</a>
                <a href="#" class="menu-btn" :class="{ active: seccionActual === 'modificar' }" @click.prevent="seccionActual = 'modificar'">Modificar Datos</a>
                <a href="#" class="menu-btn" :class="{ active: seccionActual === 'transferir' }" @click.prevent="seccionActual = 'transferir'">Transferir Persona</a>
                <a href="#" class="menu-btn" :class="{ active: seccionActual === 'correo' }" @click.prevent="seccionActual = 'correo'">Enviar Correo</a>
                <a href="#" class="menu-btn" :class="{ active: seccionActual === 'bitacora' }" @click.prevent="seccionActual = 'bitacora'">Bitácora</a>
            </div>

            <!-- tarjeta derecha-->
            <div class="right-data-card">
                
                <!--ingresar -->
                <div v-if="seccionActual === 'ingresar'" class="form-section">
                    <h2>Master</h2>
                    <form @submit.prevent="procesarFormulario('Ingresar Master')">
                        <div class="input-group">
                            <label for="usuario">Usuario Administrador</label>
                            <input id="usuario" v-model="formIngresar.usuario" type="text" placeholder="Ingrese código Master" required>
                        </div>
                        <div class="input-group">
                            <label for="region">Código Regional</label>
                            <input id="region" v-model="formIngresar.region" type="text" placeholder="Ej: REG-ARAGUA">
                        </div>
                        <div class="input-group">
                            <label for="centro">ID del Centro Médico</label>
                            <input id="centro" v-model="formIngresar.centro" type="text" placeholder="Ej: HOSP-021">
                        </div>
                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input id="password" v-model="formIngresar.password" type="password" placeholder="Ingrese su contraseña" required>
                        </div>
                        <button type="submit" class="submit-btn">Iniciar Sesión</button>
                    </form>
                </div>

                <!--para modificar-->
                <div v-if="seccionActual === 'modificar'" class="form-section">
                    <h2>Modificar Datos de Personal</h2>

                    <!--para buscar -->
                    <form v-if="!personaEncontrada" @submit.prevent="buscarPersona">
                        <div class="input-group">
                            <label for="buscarRegistro">Ingrese su cedula o codigo para buscar</label>
                            <input id="buscarRegistro" v-model="busquedaInput" type="text" placeholder="Ingrese Cédula o Código (Ej: 12345)" required>
                        </div>
                        <button type="submit" class="submit-btn">Buscar en el Sistema</button>
                    </form>

                    <!-- mostramos todos los datos cargados para editar, que deberian de estar en la base de datos -->
                    <form v-else @submit.prevent="guardarModificacion">
                        <p style="font-size: 0.85rem; color: #90e0ef; margin-bottom: 12px;">
                            Registro encontrado. Modifique los campos necesarios:
                        </p>

                        <div class="input-group">
                            <label>Nombre Completo</label>
                            <input v-model="personaSeleccionada.nombre" type="text" required>
                        </div>

                        <div class="input-group">
                            <label>Cédula</label>
                            <input v-model="personaSeleccionada.cedula" type="text" required>
                        </div>

                        <div class="input-group">
                            <label>Área / Departamento Asignado</label>
                            <input v-model="personaSeleccionada.area" type="text" required>
                        </div>

                        <div class="input-group">
                            <label>Estado</label>
                            <input v-model="personaSeleccionada.estado" type="text" required>
                        </div>

                        <button type="submit" class="submit-btn">Guardar Cambios</button>
                        <button type="button" class="submit-btn secondary-btn" @click="personaEncontrada = false">Cancelar / Buscar Otro</button>
                    </form>
                </div>

                <!--transferir-->
                <div v-if="seccionActual === 'transferir'" class="form-section">
                    <h2>Transferir Personla</h2>
                    <form @submit.prevent="procesarFormulario('Transferir')">
                        <div class="input-group">
                            <label for="nombrePersona">Nombre / ID de la Persona</label>
                            <input id="nombrePersona" v-model="formTransferir.persona" type="text" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="input-group">
                            <label for="origen">Área de Origen</label>
                            <input id="origen" v-model="formTransferir.origen" type="text" placeholder="Ej. Departamento A" required>
                        </div>
                        <div class="input-group">
                            <label for="destino">Área de Destino</label>
                            <input id="destino" v-model="formTransferir.destino" type="text" placeholder="Ej. Departamento B" required>
                        </div>
                        <button type="submit" class="submit-btn">Procesar Traslado</button>
                    </form>
                </div>

                <!--correo -->
                <div v-if="seccionActual === 'correo'" class="form-section">
                    <h2>Enviar Correo</h2>
                    <form @submit.prevent="procesarFormulario('Enviar Correo')">
                        <div class="input-group">
                            <label for="destinatario">Correo del Destinatario</label>
                            <input id="destinatario" v-model="formCorreo.email" type="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="input-group">
                            <label for="asunto">Asunto del Mensaje</label>
                            <input id="asunto" v-model="formCorreo.asunto" type="text" placeholder="Escriba el asunto..." required>
                        </div>
                        <button type="submit" class="submit-btn">Enviar Mensaje</button>
                        <!--tengo que investifgar como se ancla esto al correo-->
                    </form>
                </div>

                <!--birtacora -->
                <div v-if="seccionActual === 'bitacora'" class="form-section">
                    <h2>Bitácora de Actividades</h2>
                    <p style="color: rgba(224, 242, 254, 0.85); line-height: 1.6;">
                        <!--me falta investigar como se hace esto tambien-->

                    </p>
                </div>

            </div>

        </div>
    </div>

    <!-- el javascript con vue -->
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const seccionActual = ref('ingresar');

                //modelos
                const formIngresar = ref({ usuario: '', region: '', centro: '', password: '' });
                const formTransferir = ref({ persona: '', origen: '', destino: '' });
                const formCorreo = ref({ email: '', asunto: '' });

                // lo simulado de la busqueda
                const busquedaInput = ref('');
                const personaEncontrada = ref(false);
                const personaSeleccionada = ref({
                    nombre: '',
                    cedula: '',
                    area: '',
                    estado: ''
                });

                const buscarPersona = () => {
                    // Simulación de datos cargados según el código ingresado
                    personaSeleccionada.value = {
                        nombre: 'Keynner Lopez',
                        cedula: busquedaInput.value,
                        area: 'Emergencia - Central',
                        estado: 'Activo'
                    };
                    personaEncontrada.value = true;
                };

                const guardarModificacion = () => {
                    alert(`¡Datos de ${personaSeleccionada.value.nombre} actualizados con éxito por el Master!`);
                    personaEncontrada.value = false;
                    busquedaInput.value = '';
                };

                const procesarFormulario = (tipo) => {
                    alert(`Acción "${tipo}" ejecutada con éxito.`);
                };

                return {
                    seccionActual,
                    formIngresar,
                    formTransferir,
                    formCorreo,
                    busquedaInput,
                    personaEncontrada,
                    personaSeleccionada,
                    buscarPersona,
                    guardarModificacion,
                    procesarFormulario
                };
            }
        }).mount('#app');
    </script>

</body>
</html>
