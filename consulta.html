<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Vacunación</title>
    <meta name="view-transition" content="same-origin">
    <link rel="stylesheet" href="../public/stylesheet/consultastyle.css">
</head>
<body>
    <div class="video-overlay"></div>
    <div class="content-wrapper">
        <div class="top-navbar">
            <button class="settings-icon" title="Ajustes">☰</button>
            <div class="profile-container">
                <button class="profile-btn active" id="btn-Publico">Consulta de Registro de Vacunación</button>
            </div>
            <div style="width: 40px;"></div>
        </div>

        <div class="center-container">
            <div class="custom-card">
                <div class="text-card-white mb-4">
                    <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;">Consulta de Vacunación</h2>
                    <p style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Ingrese sus datos personales para verificar</p>
                </div>

                <form id="form-consulta-publica">
                    <!-- Primer y Segundo Nombre -->
                    <div class="form-row-grid">
                        <div>
                            <label for="primerNombre" class="form-label">Primer Nombre</label>
                            <input type="text" id="primerNombre" class="form-control" placeholder="Ej: Albert" required>
                        </div>
                        <div>
                            <label for="segundoNombre" class="form-label">Segundo Nombre</label>
                            <input type="text" id="segundoNombre" class="form-control" placeholder="Ej: jose" required>
                        </div>
                    </div>

                    <!-- Primer y Segundo Apellido -->
                    <div class="form-row-grid">
                        <div>
                            <label for="primerApellido" class="form-label">Primer Apellido</label>
                            <input type="text" id="primerApellido" class="form-control" placeholder="Ej: Blanco" required>
                        </div>
                        <div>
                            <label for="segundoApellido" class="form-label">Segundo Apellido</label>
                            <input type="text" id="segundoApellido" class="form-control" placeholder="Ej: Cordova" required>
                        </div>
                    </div>

                    <!-- Cédula -->
                    <div class="mb-4">
                        <label for="cedula" class="form-label">Cédula de Identidad</label>
                        <input type="text" id="cedula" class="form-control" placeholder="Ej: V-32128027" required>
                    </div>

                    <button type="submit" class="btn-submit">Consultar Estado</button>
                    <a href="index.html" class="btn-submit" style="display: block; text-align: center; text-decoration: none; background-color: rgba(255,255,255,0.15); margin-bottom: 0;">Volver al Inicio</a>
                </form>

                <!-- Ficha del Resultado -->
                <div id="resultado-card" class="result-card">
                    <h3>Expediente Clínico de Vacunación</h3>
                    
                    <div style="margin-bottom: 12px; font-size: 0.92rem; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 8px;">
                        <div><strong>Paciente:</strong> <span id="res-nombre-completo" style="color: #90e0ef;"></span></div>
                        <div><strong>Cédula:</strong> <span id="res-cedula"></span></div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong style="color: #38bdf8;">Historial Completo de Vacunas:</strong>
                        <span id="res-total-vacunas" style="background: #0d6efd; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;"></span>
                    </div>

                    <div id="lista-vacunas-container" class="vaccines-scroll-list"></div>
                </div>

                <!-- Mensaje de Error / Coincidencia Fallida -->
                <div id="error-card" class="error-card">
                     <span id="error-texto">No se encontraron registros de vacunación asociados a esta cédula.</span>
                </div>

            </div>
        </div>
    </div>

<script>
const settingsBtn = document.querySelector('.settings-icon');
if (settingsBtn) {
    settingsBtn.addEventListener('click', () => {
        alert("el boton de ajustes");
    });
}

const datosPorDefecto = [
    {
        cedula: "V-32128027",
        primerNombre: "Albert",
        segundoNombre: "Jose",
        primerApellido: "Blanco",
        segundoApellido: "Cordova",
        vacunas: [
            {
                vacuna: "Toxoide Tetánico-Diftérico (Td)",
                dosis: "Primer Refuerzo",
                fecha: "2026-01-10",
                lote: "TX-9921",
                centro: "Hospital Central de Maracay",
                observaciones: "Sin reacciones adversas inmediatas."
            },
            {
                vacuna: "Fiebre Amarilla (Antiamarílica)",
                dosis: "Dosis Única",
                fecha: "2025-05-18",
                lote: "FA-5512",
                centro: "Ambulatorio del Norte",
                observaciones: "Paciente inmunizado."
            }
        ]
    }
];

const formConsulta = document.getElementById('form-consulta-publica');
const resCard = document.getElementById('resultado-card');
const errCard = document.getElementById('error-card');
const errorTexto = document.getElementById('error-texto');
const listaVacunasContainer = document.getElementById('lista-vacunas-container');

// Función para limpiar texto genérico (quita espacios extra y pasa a minúsculas)
const normalizar = (txt) => (txt || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');

// Función para extraer solo los números de una cédula (ej: "V-32128027" o "v-32128027" pasa a "32128027")
const extraerNumeros = (txt) => (txt || '').toString().replace(/[^0-9]/g, '');

formConsulta.addEventListener('submit', (e) => {
    e.preventDefault();

    // 1. Obtener valores ingresados
    const cedulaIngresada = document.getElementById('cedula').value;
    const pNombreIngresado = normalizar(document.getElementById('primerNombre').value);
    const sNombreIngresado = normalizar(document.getElementById('segundoNombre').value);
    const pApellidoIngresado = normalizar(document.getElementById('primerApellido').value);
    const sApellidoIngresado = normalizar(document.getElementById('segundoApellido').value);

    const numerosCedulaIngresada = extraerNumeros(cedulaIngresada);

    // Cargar base de datos (localStorage o default)
    let baseDatos = JSON.parse(localStorage.getItem('registros_vacunacion_multiples')) || datosPorDefecto;

    // 2. Buscar el registro comparando UNICAMENTE los números de la cédula (así ignoramos si pusieron V, v, guiones o espacios)
    const registroEncontrado = baseDatos.find(item => {
        return extraerNumeros(item.cedula) === numerosCedulaIngresada;
    });

    if (!registroEncontrado) {
        resCard.style.display = 'none';
        errorTexto.textContent = `No se encontró ningún registro asociado a la cédula "${cedulaIngresada}".`;
        errCard.style.display = 'block';
        return;
    }

    // 3. Validar nombres y apellidos ignorando mayúsculas/minúsculas y espacios
    const coincidePNombre = (pNombreIngresado === normalizar(registroEncontrado.primerNombre));
    const coincideSNombre = (sNombreIngresado === normalizar(registroEncontrado.segundoNombre));
    const coincidePApellido = (pApellidoIngresado === normalizar(registroEncontrado.primerApellido));
    const coincideSApellido = (sApellidoIngresado === normalizar(registroEncontrado.segundoApellido));

    if (!coincidePNombre || !coincideSNombre || !coincidePApellido || !coincideSApellido) {
        resCard.style.display = 'none';
        errorTexto.innerHTML = `<strong>Error:</strong> Los datos ingresados no coinciden exactamente con los registros oficiales de la cédula <strong>${registroEncontrado.cedula}</strong>. Verifique la ortografía.`;
        errCard.style.display = 'block';
        return;
    }

    // 4. Si todo es correcto, desplegar la tarjeta de resultado con las vacunas
    const nombreCompleto = `${registroEncontrado.primerNombre} ${registroEncontrado.segundoNombre || ''} ${registroEncontrado.primerApellido} ${registroEncontrado.segundoApellido || ''}`.replace(/\s+/g, ' ').trim();
    
    document.getElementById('res-nombre-completo').textContent = nombreCompleto;
    document.getElementById('res-cedula').textContent = registroEncontrado.cedula;

    const vacunas = registroEncontrado.vacunas || [];
    document.getElementById('res-total-vacunas').textContent = `${vacunas.length} Registradas`;
    listaVacunasContainer.innerHTML = '';

    if (vacunas.length > 0) {
        const vacunasOrdenadas = [...vacunas].reverse();
        vacunasOrdenadas.forEach((vac) => {
            const itemCard = document.createElement('div');
            itemCard.className = 'vaccine-item-card';
            itemCard.style.cssText = 'background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-top: 8px;';
            itemCard.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-weight: bold; color: #fff;">
                    <span>${vac.vacuna}</span>
                    <span style="font-size: 0.8rem; background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 2px 8px; border-radius: 6px;">${vac.dosis}</span>
                </div>
                <div style="margin-top: 6px; color: #e2e8f0; font-size: 0.85rem;">
                    <strong>Fecha:</strong> ${vac.fecha} | <strong>Lote:</strong> ${vac.lote || 'N/A'}<br>
                    <strong>Centro:</strong> ${vac.centro}<br>
                    ${vac.observaciones ? `<em style="color: #a5b4fc; font-size: 0.83rem;">Obs: ${vac.observaciones}</em>` : ''}
                </div>
            `;
            listaVacunasContainer.appendChild(itemCard);
        });
    } else {
        listaVacunasContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.6); padding: 10px;">No posee dosis registradas hasta la fecha.</div>';
    }

    errCard.style.display = 'none';
    resCard.style.display = 'block';
});
</script>

</body>
</html>
