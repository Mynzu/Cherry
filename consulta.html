<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Vacunación</title>
    <meta name="view-transition" content="same-origin">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-image: url('fondo2.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            overflow-y: auto;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 25, 47, 0.75);
            z-index: 1;
        }
        .content-wrapper {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .center-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 10px 20px 30px 20px;
        }
        
        .top-navbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            width:100%;
            padding: 25px 40px;
        }
        
        .profile-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-grow: 1;
        }

        .profile-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7); 
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
        }

        .profile-btn.active, .profile-btn:hover {
            color: #ffffff !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            border-bottom: 3px solid #0d6efd;
        }

        .settings-icon {
            color: #ffffff;
            font-size: 2rem;
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .custom-card {
            background-color: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 25px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .text-card-white {
            color: #ffffff !important;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); 
        }
        .mb-3 { 
            margin-bottom: 20px; 
        }

        .mb-4 { 
            margin-bottom: 25px; 
        }

        .form-label {
            display: block;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(0, 0, 0, 0.35);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #0d6efd;
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.65) !important;
        }

        .btn-submit {
            width: 100%;
            padding: 12px 14px; 
            background-color: #0d6efd; 
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem; 
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.35); 
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .top-navbar { 
                flex-direction: column; 
                gap: 15px; 
                padding: 15px 20px; 
            }

            .settings-icon {
                align-self: flex-start; 
            }

            .profile-container { 
                flex-direction: column; 
                gap: 10px; width: 100%; 
                text-align: center; 
            }

            .content-wrapper { 
                height: auto; 
                padding-bottom: 100px; 
            }

            .profile-btn { 
                font-size: 1.1rem; 
                padding: 5px 0; 
            }

            .top-navbar div[style*="width"] { 
                display: none !important; 
            }

            .custom-card { 
                padding: 25px 20px;  
            }
        }

    </style>
</head>
<body>
    <div class="video-overlay"></div>
    <div class="content-wrapper">
        <div class="top-navbar">
            <button class="settings-icon" title="Ajustes">☰</button>
            <div class="profile-container">
                <button class="profile-btn active" id="btn-Publico">Consulta de Registro de Vacunación</button>
            </div>
            <div style="width: 40px;"></div>
        </div>

        <div class="center-container">
            <div class="custom-card">
                <div class="text-card-white mb-4">
                    <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 8px;">Consulta de Vacunación</h2>
                    <p style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Ingrese sus datos</p>
                </div>

                <form id="form-consulta-publica">
                    <div class="mb-3">
                        <label for="nombre-consulta" class="form-label">Nombre Completo</label>
                        <input type="text" id="nombre-consulta" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
    
                    <div class="mb-4">
                        <label for="cedula-consulta" class="form-label">Cédula de Identidad</label>
                        <input type="text" id="cedula-consulta" class="form-control" placeholder="Ej: V-12345678" required>
                    </div>

                    <button type="submit" class="btn-submit">Consultar Estado</button>
                    <a href="index.html" class="btn-submit" style="display: block; text-align: center; text-decoration: none; background-color: rgba(255,255,255,0.15); margin-bottom: 0;">Volver al Inicio</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        const settingsBtn = document.querySelector('.settings-icon');
        settingsBtn.addEventListener('click', () => {
            alert("aja el boton de ajustes xd");
        });

        const formConsulta = document.getElementById('form-consulta-publica');
        formConsulta.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombreUsuario = document.getElementById('nombre-consulta').value;
            const cedulaUsuario = document.getElementById('cedula-consulta').value;
            alert(`Enviando a Base de Datos... \nNombre: ${nombreUsuario} \nCédula: ${cedulaUsuario}`);
        });
    </script>
</body>
</html>
